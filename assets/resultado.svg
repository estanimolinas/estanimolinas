<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Accuracy on held-out test set</title>
<desc id="d">Base model with optimized prompt: 28.4% correct (95% CI 24.9 to 32.2). QLoRA fine-tuned: 72.8% correct (95% CI 69.1 to 76.3). 585 questions from 23 dataset families absent from training.</desc>
<style>
:root{--tx:#1f2328;--mu:#59636e;--ac:#0969da;--gr:#8c959f;--ln:#d1d9e0}
@media (prefers-color-scheme:dark){:root{--tx:#e6edf3;--mu:#9198a1;--ac:#4493f8;--gr:#6e7681;--ln:#30363d}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--tx)}
.h{font-size:18px;font-weight:700}.l{font-size:15px}.v{font-size:20px;font-weight:700}.m{font-size:13px;fill:var(--mu)}
.bar{transform-box:fill-box;transform-origin:left center;animation:gr 9s ease-out infinite}
.b2{animation-delay:.4s}
.vv{animation:fd 9s infinite}
.vv2{animation:fd 9s infinite .4s}
@keyframes gr{0%{transform:scaleX(0)}18%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes fd{0%,12%{opacity:0}22%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar,.vv,.vv2{animation:none}}
</style>
<text class="h" x="30" y="32">Correct answers on the held-out test set</text>
<text class="m" x="30" y="52">585 questions · 23 dataset families absent from training · Wilson 95% intervals</text>
<text class="l" x="30" y="100">Base model + optimized prompt</text>
<rect x="30" y="110" width="600" height="26" rx="4" fill="none" stroke="var(--ln)"/>
<rect class="bar" x="30" y="110" width="170.4" height="26" rx="4" fill="var(--gr)"/>
<text class="v vv" x="212" y="130">28.4%</text><text class="m vv" x="290" y="130">24.9 – 32.2</text>
<text class="l" x="30" y="178">QLoRA fine-tuned</text>
<rect x="30" y="188" width="600" height="26" rx="4" fill="none" stroke="var(--ln)"/>
<rect class="bar b2" x="30" y="188" width="436.8" height="26" rx="4" fill="var(--ac)"/>
<text class="v vv2" x="478" y="208">72.8%</text><text class="m vv2" x="556" y="208">69.1 – 76.3</text>
<text class="v vv2" x="720" y="130" style="fill:var(--ac)">+44.4 pts</text>
<text class="m vv2" x="720" y="150">family-level interval</text>
<text class="m vv2" x="720" y="168">+37.2 to +51.9</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
