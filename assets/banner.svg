<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Estanislao Molinas</title>
<desc id="d">Junior AI & Data Engineer - Agents - Harness - Telemtry </desc>
<style>
:root{--tx:#1f2328;--mu:#59636e;--ac:#0969da;--ln:#d1d9e0;--bg:#ffffff}
@media (prefers-color-scheme:dark){:root{--tx:#e6edf3;--mu:#9198a1;--ac:#4493f8;--ln:#30363d;--bg:#0d1117}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.n{font-size:40px;font-weight:700;fill:var(--tx);letter-spacing:-.5px}
.s{font-size:18px;fill:var(--mu)}
.lb{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;fill:var(--mu);animation:lit 10s infinite}
.ln{stroke:var(--ln);stroke-width:1.5}
.nd{fill:var(--bg);stroke:var(--ln);stroke-width:1.5}
.k0{animation-delay:0s}.k1{animation-delay:2s}.k2{animation-delay:4s}.k3{animation-delay:6s}.k4{animation-delay:8s}
@keyframes lit{0%{fill:var(--mu)}2%,12%{fill:var(--ac)}22%,100%{fill:var(--mu)}}
@media (prefers-reduced-motion:reduce){.lb{animation:none}.pulse{display:none}}
</style>
<text class="n" x="30" y="62">Estanislao Molinas</text>
<text class="s" x="30" y="94">Data &amp; AI Software Developer</text>
<line class="ln" x1="30" y1="150" x2="870" y2="150"/>
<circle cx="30" cy="150" r="4.5" class="nd"/><text class="lb k0" x="30" y="176" text-anchor="start">Data</text><circle cx="240" cy="150" r="4.5" class="nd"/><text class="lb k1" x="240" y="176" text-anchor="middle">Backend</text><circle cx="450" cy="150" r="4.5" class="nd"/><text class="lb k2" x="450" y="176" text-anchor="middle">Models</text><circle cx="660" cy="150" r="4.5" class="nd"/><text class="lb k3" x="660" y="176" text-anchor="middle">Interface</text><circle cx="870" cy="150" r="4.5" class="nd"/><text class="lb k4" x="870" y="176" text-anchor="end">Evaluation</text>
<circle class="pulse" r="5" cy="0" fill="var(--ac)"><animateMotion dur="10s" repeatCount="indefinite" path="M30 150H870" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
